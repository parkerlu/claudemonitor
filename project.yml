# XcodeGen project definition.
#
#   brew install xcodegen && xcodegen generate && open EnDraft.xcodeproj
#
# Change PRODUCT_BUNDLE_IDENTIFIER and the App Group below to your own before
# building — the placeholders will not sign.

name: EnDraft
options:
  bundleIdPrefix: com.parkerlu.endraft
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "5X3QDNMZ83"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only

targets:

  EnDraft:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EnDraft
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkerlu.endraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/EnDraft.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parkerlu.endraft
    dependencies:
      - target: EnDraftMessages
        embed: true

  EnDraftMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension
      - path: Shared
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: EnDraft
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkerlu.endraft.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    entitlements:
      path: MessagesExtension/EnDraftMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parkerlu.endraft

  # Mac shell. macOS has no Messages extension point — Messages.framework is
  # API_UNAVAILABLE(macos) — so this floats above whatever you are typing in
  # and pastes into it. Shares Shared/ wholesale; only the shell differs.
  EnDraftMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: EnDraft
        # Menu-bar only: no Dock icon, no window on launch.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkerlu.endraft.mac
        PRODUCT_NAME: EnDraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Mac/EnDraftMac.entitlements
      properties:
        # Not sandboxed on purpose: a sandboxed app cannot post the synthetic
        # ⌘V into another application. Personal build, never distributed.
        com.apple.security.app-sandbox: false

